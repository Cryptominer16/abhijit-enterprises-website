name: CI/CD Pipeline - Abhijit Enterprises

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint, Validate HTML & Check Broken Assets
  # -------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript Syntax
        run: |
          node -c assets/js/i18n.js
          node -c assets/js/main.js
          echo "JavaScript syntax valid."

      - name: Verify Internal Links & Assets
        run: |
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('.').filter(f => f.endsWith('.html'));
            const allHtml = new Set(files);
            let errors = 0;
            files.forEach(f => {
              const content = fs.readFileSync(f, 'utf8');
              const linkMatches = [...content.matchAll(/href=[\"']([^\"'#:]+)(?:#[^\"']*)?[\"']/g)].map(m => m[1]);
              linkMatches.forEach(link => {
                if (link.endsWith('.html') && !allHtml.has(link)) {
                  console.error('Broken link in ' + f + ': ' + link);
                  errors++;
                }
              });
              const srcMatches = [...content.matchAll(/src=[\"']([^\"':]+)[\"']/g)].map(m => m[1]);
              srcMatches.forEach(src => {
                if (src && !fs.existsSync(src)) {
                  console.error('Missing asset in ' + f + ': ' + src);
                  errors++;
                }
              });
            });
            if (errors > 0) process.exit(1);
            console.log('All ' + files.length + ' HTML files and assets verified successfully.');
          "

  # -------------------------------------------------------------
  # Job 2: Deploy to GitHub Pages (Live Instant Preview)
  # -------------------------------------------------------------
  deploy-pages:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # Job 3: Automated GoDaddy cPanel Deployment via FTP (Optional)
  # Activated automatically when FTP secrets are added in GitHub
  # -------------------------------------------------------------
  deploy-cpanel:
    needs: validate
    if: github.ref == 'refs/heads/main' && env.HAS_FTP_SECRET == 'true'
    env:
      HAS_FTP_SECRET: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Files to GoDaddy public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/README.md
            **/GODADDY_CPANEL_DEPLOYMENT.md
            **/OWNER_CONFIRMATION_CHECKLIST.md
            **/WEBSITE_EDITING_GUIDE.md
            **/start-preview.bat
            **/*.md
