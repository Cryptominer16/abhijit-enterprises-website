name: CI/CD Pipeline - Abhijit Enterprises

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript Syntax
        run: |
          node -c script.js
          echo "JavaScript syntax valid."

      - name: Verify Internal Links & Assets
        run: |
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('.').filter(f => f.endsWith('.html'));
            const allHtml = new Set(files);
            let errors = 0;
            files.forEach(f => {
              const content = fs.readFileSync(f, 'utf8');
              const linkMatches = [...content.matchAll(/href=[\"']([^\"'#:]+)(?:#[^\"']*)?[\"']/g)].map(m => m[1]);
              linkMatches.forEach(link => {
                if (link.endsWith('.html') && !allHtml.has(link)) {
                  console.error('Broken link in ' + f + ': ' + link);
                  errors++;
                }
              });
              const srcMatches = [...content.matchAll(/src=[\"']([^\"':]+)[\"']/g)].map(m => m[1]);
              srcMatches.forEach(src => {
                if (src && !fs.existsSync(src)) {
                  console.error('Missing asset in ' + f + ': ' + src);
                  errors++;
                }
              });
            });
            if (errors > 0) process.exit(1);
            console.log('All ' + files.length + ' HTML files and assets verified successfully.');
          "

  deploy-pages:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
