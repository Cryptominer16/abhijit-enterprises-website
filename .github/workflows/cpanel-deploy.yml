name: Deploy to GoDaddy cPanel (FTP)

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Sync files to public_html'
        required: true
        default: 'sync'

jobs:
  deploy-cpanel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Files to GoDaddy public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/README.md
            **/GODADDY_CPANEL_DEPLOYMENT.md
            **/OWNER_CONFIRMATION_CHECKLIST.md
            **/WEBSITE_EDITING_GUIDE.md
            **/start-preview.bat
            **/*.md
