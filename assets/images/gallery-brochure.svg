<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Tri-Fold Brochure Mockup -->
  <!-- Left panel -->
  <polygon points="160,140 320,110 320,430 160,460" fill="#0f2b48" stroke="#1e4e8c" stroke-width="2"/>
  <rect x="180" y="160" width="110" height="20" rx="3" fill="#f59e0b"/>
  <rect x="180" y="200" width="120" height="8" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="180" y="220" width="90" height="8" rx="2" fill="#ffffff" opacity="0.6"/>

  <!-- Center panel -->
  <polygon points="320,110 480,110 480,430 320,430" fill="#1e3a8a" stroke="#2563eb" stroke-width="2"/>
  <circle cx="400" cy="200" r="40" fill="#38bdf8"/>
  <rect x="350" y="270" width="100" height="14" rx="3" fill="#ffffff"/>
  <rect x="340" y="300" width="120" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="340" y="320" width="120" height="8" rx="2" fill="#cbd5e1"/>

  <!-- Right panel -->
  <polygon points="480,110 640,140 640,460 480,430" fill="#0f2b48" stroke="#1e4e8c" stroke-width="2"/>
  <rect x="500" y="160" width="110" height="60" rx="4" fill="#1e293b"/>
  <rect x="500" y="240" width="100" height="8" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="500" y="260" width="80" height="8" rx="2" fill="#ffffff" opacity="0.6"/>

  <text x="400" y="515" font-family="'Poppins', sans-serif" font-size="24" font-weight="700" fill="#0f2b48" text-anchor="middle">
    Commercial Tri-Fold Brochures &amp; Flyers
  </text>
  <text x="400" y="550" font-family="'Poppins', sans-serif" font-size="16" fill="#64748b" text-anchor="middle">
    High-Impact Marketing Collateral on 300 GSM Art Card
  </text>
</svg>

