<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gWedding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gWedding)"/>
  
  <!-- Outer Ornate Border -->
  <rect x="50" y="50" width="700" height="500" rx="12" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="70" y="70" width="660" height="460" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>

  <!-- Traditional Motif / Ganesha Silhouette / Kalash Motif -->
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="45" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M-15 -10 C-15 -25 15 -25 15 -10 C15 15 -15 25 0 35 C15 25 -15 15 -15 -10 Z" fill="url(#gGold)"/>
    <circle cx="0" cy="-5" r="4" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="400" y="290" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="34" font-weight="700" fill="#92400e" text-anchor="middle">
    || शुभ विवाह आमंत्रण ||
  </text>
  <text x="400" y="340" font-family="'Poppins', sans-serif" font-size="20" font-weight="600" fill="#0f2b48" text-anchor="middle">
    Royal Wedding Invitation Card
  </text>
  <text x="400" y="380" font-family="'Poppins', sans-serif" font-size="15" fill="#78350f" text-anchor="middle">
    Premium Gold Foil • Embossed Finish • Custom Envelope
  </text>

  <!-- Bottom Accent / Details -->
  <g transform="translate(400, 440)">
    <rect x="-140" y="0" width="280" height="36" rx="18" fill="#d97706"/>
    <text x="0" y="23" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
      ABHIJIT ENTERPRISES • AKLUJ
    </text>
  </g>
</svg>

