<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgDP)"/>
  
  <!-- Digital Press Unit Body -->
  <rect x="120" y="140" width="560" height="320" rx="16" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Digital Screens & Panels -->
  <rect x="160" y="180" width="220" height="130" rx="8" fill="#0284c7"/>
  <rect x="180" y="200" width="180" height="16" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="180" y="230" width="120" height="12" rx="4" fill="#38bdf8"/>
  <rect x="180" y="255" width="140" height="12" rx="4" fill="#bae6fd"/>
  
  <!-- CMYK Cartridge Bay -->
  <circle cx="440" cy="220" r="24" fill="#00ffff" stroke="#ffffff" stroke-width="2"/>
  <text x="440" y="226" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">C</text>
  <circle cx="500" cy="220" r="24" fill="#ff00ff" stroke="#ffffff" stroke-width="2"/>
  <text x="500" y="226" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">M</text>
  <circle cx="560" cy="220" r="24" fill="#ffff00" stroke="#ffffff" stroke-width="2"/>
  <text x="560" y="226" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Y</text>
  <circle cx="620" cy="220" r="24" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text x="620" y="226" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">K</text>

  <!-- Output Tray -->
  <rect x="160" y="360" width="480" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="220" y="340" width="360" height="25" rx="3" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="400" y="520" font-family="'Poppins', sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Commercial Digital Colour Press
  </text>
  <text x="400" y="555" font-family="'Poppins', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">
    High-Resolution Multi-Colour Printing at Abhijit Enterprises
  </text>
</svg>

