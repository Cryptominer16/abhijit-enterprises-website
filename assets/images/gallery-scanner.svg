<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0f172a"/>
  
  <!-- High Speed Production Scanner -->
  <rect x="200" y="160" width="400" height="240" rx="14" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Automatic Document Feeder -->
  <polygon points="260,160 540,160 500,100 300,100" fill="#334155" stroke="#475569" stroke-width="2"/>
  
  <!-- Scanning Light Bar simulation -->
  <rect x="220" y="270" width="360" height="12" rx="6" fill="#38bdf8" filter="drop-shadow(0 0 12px #38bdf8)"/>
  
  <!-- Paper stack moving through -->
  <rect x="310" y="120" width="180" height="20" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="310" y="320" width="180" height="40" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="330" y="335" width="140" height="4" fill="#cbd5e1"/>
  <rect x="330" y="345" width="100" height="4" fill="#cbd5e1"/>

  <!-- Speed & Specs Badge -->
  <g transform="translate(400, 430)">
    <rect x="-170" y="0" width="340" height="38" rx="19" fill="#059669"/>
    <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
      HIGH-SPEED A3 / A4 PRODUCTION SCANNER
    </text>
  </g>

  <text x="400" y="520" font-family="'Poppins', sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Bulk Document Digitisation Unit
  </text>
  <text x="400" y="555" font-family="'Poppins', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">
    Rapid Scanning for Legal, Education &amp; Business Records
  </text>
</svg>

