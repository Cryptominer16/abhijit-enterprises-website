<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e4e8c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark: Modern stylized layered print & digital folds -->
  <g transform="translate(10, 8)">
    <!-- Base diamond/layer 1 -->
    <path d="M35 5 L65 22 L35 39 L5 22 Z" fill="#0f2b48" opacity="0.9"/>
    <!-- Middle diamond/layer 2 (Print cyan-blue) -->
    <path d="M35 22 L65 39 L35 56 L5 39 Z" fill="url(#brandGrad)"/>
    <!-- Top diamond/layer 3 (Vibrant Accent gold) -->
    <path d="M35 39 L65 56 L35 73 L5 56 Z" fill="url(#accentGrad)"/>
    
    <!-- Stylized 'A' cut monogram inside -->
    <circle cx="35" cy="38" r="6" fill="#ffffff" opacity="0.95"/>
    <path d="M35 27 L41 45 L29 45 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Business Name & Identity Typography -->
  <g transform="translate(85, 20)">
    <!-- Main Title -->
    <text x="0" y="24" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#0f2b48" letter-spacing="0.5">
      ABHIJIT
    </text>
    <text x="112" y="24" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="25" font-weight="500" fill="#d97706" letter-spacing="1.5">
      ENTERPRISES
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="44" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="2">
      PRINTING • DIGITAL SERVICES • TRAVEL | AKLUJ
    </text>
  </g>
</svg>

