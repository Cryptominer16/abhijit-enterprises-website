<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgSea)"/>
  
  <!-- Sun -->
  <circle cx="620" cy="140" r="60" fill="url(#sunGrad)"/>

  <!-- Luxury Cruise Ship Silhouette -->
  <g transform="translate(180, 210)">
    <!-- Main Hull -->
    <path d="M0 90 L40 130 L400 130 L450 70 L0 70 Z" fill="#ffffff" stroke="#0f2b48" stroke-width="2"/>
    <!-- Waterline red stripe -->
    <path d="M25 115 L40 130 L400 130 L415 115 Z" fill="#ef4444"/>
    <!-- Decks -->
    <rect x="50" y="45" width="340" height="25" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="90" y="25" width="260" height="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="140" y="5" width="160" height="20" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Funnel -->
    <polygon points="180,5 195,-20 225,-20 220,5" fill="#0284c7"/>
    <rect x="195" y="-15" width="28" height="6" fill="#f59e0b"/>
    <!-- Cabin windows -->
    <circle cx="80" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="110" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="140" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="170" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="200" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="230" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="260" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="290" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="320" cy="57" r="4" fill="#0f2b48"/>
    <circle cx="350" cy="57" r="4" fill="#0f2b48"/>
  </g>

  <!-- Waves -->
  <path d="M0 360 Q 200 340, 400 360 T 800 360 L 800 600 L 0 600 Z" fill="#0369a1" opacity="0.6"/>
  <path d="M0 390 Q 200 370, 400 390 T 800 390 L 800 600 L 0 600 Z" fill="#0c4a6e" opacity="0.9"/>

  <text x="400" y="515" font-family="'Poppins', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    Luxury Cruise &amp; Holiday Booking Assistance
  </text>
  <text x="400" y="550" font-family="'Poppins', sans-serif" font-size="16" fill="#bae6fd" text-anchor="middle">
    Assistance for Cordelia Cruises, Domestic &amp; International Tours
  </text>
</svg>

