<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgP)"/>
  
  <!-- Subtle geometric grid pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.07">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
  </g>

  <!-- Digital Press Concept Body -->
  <rect x="70" y="140" width="300" height="190" rx="12" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="90" y="160" width="260" height="70" rx="6" fill="#0f172a"/>
  
  <!-- Control screen -->
  <rect x="105" y="172" width="100" height="46" rx="4" fill="#0284c7" opacity="0.8"/>
  <circle cx="120" cy="195" r="8" fill="#38bdf8"/>
  <rect x="135" y="186" width="55" height="4" rx="2" fill="#ffffff"/>
  <rect x="135" y="196" width="35" height="4" rx="2" fill="#ffffff" opacity="0.7"/>

  <!-- CMYK ink dots indication -->
  <circle cx="235" cy="195" r="9" fill="#06b6d4"/>
  <circle cx="260" cy="195" r="9" fill="#ec4899"/>
  <circle cx="285" cy="195" r="9" fill="#facc15"/>
  <circle cx="310" cy="195" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

  <!-- Paper output tray & flying printed sheets -->
  <path d="M370 230 L490 190 L520 220 L400 260 Z" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
  <path d="M360 215 L480 175 L510 205 L390 245 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Print design on sheet -->
  <rect x="400" y="195" width="70" height="12" rx="2" fill="url(#cyanGrad)" transform="rotate(-18 400 195)"/>
  <rect x="405" y="215" width="50" height="8" rx="2" fill="url(#goldGrad)" transform="rotate(-18 405 215)"/>

  <!-- Floating Digital Services / Identity Cards on right -->
  <g transform="translate(390, 60)">
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#ffffff" filter="drop-shadow(0 15px 20px rgba(0,0,0,0.25))"/>
    <rect x="12" y="14" width="36" height="36" rx="18" fill="#e0f2fe"/>
    <circle cx="30" cy="32" r="10" fill="#0284c7"/>
    <rect x="58" y="18" width="85" height="10" rx="3" fill="#0f2b48"/>
    <rect x="58" y="34" width="60" height="7" rx="3" fill="#94a3b8"/>
    <path d="M12 65 L148 65" stroke="#f1f5f9" stroke-width="2"/>
    <rect x="12" y="75" width="50" height="12" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="37" y="84" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">VERIFIED</text>
    <rect x="70" y="75" width="78" height="12" rx="6" fill="#fef3c7"/>
    <text x="109" y="84" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#d97706" text-anchor="middle">ONLINE / PAN</text>
  </g>

  <!-- Floating Travel / Cruise Badge -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#ffffff" filter="drop-shadow(0 12px 18px rgba(0,0,0,0.25))"/>
    <circle cx="35" cy="35" r="20" fill="#fef3c7"/>
    <!-- Ship anchor / cruise silhouette -->
    <path d="M35 24 L35 44 M26 36 C26 43, 44 43, 44 36 M29 28 L41 28" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <text x="65" y="32" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#0f2b48">Travel &amp; Cruise</text>
    <text x="65" y="47" font-family="'Poppins', sans-serif" font-size="9" font-weight="500" fill="#64748b">Booking Assistance</text>
  </g>

  <!-- Speed Scan Badge -->
  <g transform="translate(130, 275)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.2))"/>
    <rect x="10" y="10" width="40" height="40" rx="6" fill="#ecfdf5"/>
    <path d="M22 25 L38 25 M22 30 L38 30 M22 35 L32 35" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="27" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#0f2b48">Bulk Document Scanning</text>
    <text x="60" y="44" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="500" fill="#059669">High Speed A3 &amp; A4 Digitisation</text>
  </g>
</svg>

